name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt
          pip install -r requirements/requirements-docker.txt
          pip install "dvc[gdrive]==3.67.1"

      - name: Configure DVC credentials
        env:
          DVC_GDRIVE_CREDENTIALS: ${{ secrets.DVC_GDRIVE_CREDENTIALS }}
        run: |
          echo "$DVC_GDRIVE_CREDENTIALS" > "${RUNNER_TEMP}/gdrive-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gdrive-credentials.json" >> "$GITHUB_ENV"

      - name: Pull DVC data
        run: dvc pull

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t olist-api .
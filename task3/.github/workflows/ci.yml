name: CI/CD

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt
          pip install -r requirements/requirements-docker.txt
          pip install "dvc[gdrive]==3.67.1"

      - name: Configure DVC credentials
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.DVC_GDRIVE_CREDENTIALS }}
        run: |
          echo "GDRIVE_CREDENTIALS_DATA=$GDRIVE_CREDENTIALS_DATA" >> "$GITHUB_ENV"

      - name: Pull DVC data
        run: dvc pull

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: Run tests
        run: pytest -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest